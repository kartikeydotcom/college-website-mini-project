
<!DOCTYPE html>
<html>
<head>
    <title>ECE Catalogue</title>
    <link rel="stylesheet" href="style.css">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f6b982;
        }
        img {
            width: 70px;
            height: 85px;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body>

<h3 align="center">ECE Book Catalogue</h3>

<table>
    <tr>
        <th>Book Image</th>
        <th>Book Details</th>
        <th>Price</th>
        <th>Cart</th>
    </tr>

    <tr>
        <td><img src="ece1.jpg" alt="Electronic Devices"></td>
        <td>
            Book: Electronic Devices<br>
            Author: Boylestad<br>
            Publisher: Pearson
        </td>
        <td>Rs. 450</td>
        <td><button>Add to Cart</button></td>
    </tr>

    <tr>
        <td><img src="ece2.jpg" alt="Communication Systems"></td>
        <td>
            Book: Communication Systems<br>
            Author: Simon Haykin<br>
            Publisher: Wiley
        </td>
        <td>Rs. 500</td>
        <td><button>Add to Cart</button></td>
    </tr>

    <tr>
        <td><img src="ece3.jpg" alt="Digital Electronics"></td>
        <td>
            Book: Digital Electronics<br>
            Author: Morris Mano<br>
            Publisher: Pearson
        </td>
        <td>Rs. 350</td>
        <td><button>Add to Cart</button></td>
    </tr>
</table>

</body>
</html>
