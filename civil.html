
<!DOCTYPE html>
<html>
<head>
    <title>CIVIL Catalogue</title>
    <link rel="stylesheet" href="style.css">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f6b982;
        }
        img {
            width: 70px;
            height: 85px;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body>

<h3 align="center">CIVIL Book Catalogue</h3>

<table>
    <tr>
        <th>Book Image</th>
        <th>Book Details</th>
        <th>Price</th>
        <th>Cart</th>
    </tr>

    <tr>
        <td><img src="civil1.jpg" alt="Building Construction"></td>
        <td>
            Book: Building Construction<br>
            Author: B. C. Punmia<br>
            Publisher: Laxmi
        </td>
        <td>Rs. 450</td>
        <td><button>Add to Cart</button></td>
    </tr>

    <tr>
        <td><img src="civil2.jpg" alt="Strength of Materials"></td>
        <td>
            Book: Strength of Materials<br>
            Author: R. K. Bansal<br>
            Publisher: Laxmi
        </td>
        <td>Rs. 500</td>
        <td><button>Add to Cart</button></td>
    </tr>

    <tr>
        <td><img src="civil3.jpg" alt="Surveying"></td>
        <td>
            Book: Surveying<br>
            Author: B. C. Punmia<br>
            Publisher: Laxmi
        </td>
        <td>Rs. 400</td>
        <td><button>Add to Cart</button></td>
    </tr>
</table>

</body>
</html>
