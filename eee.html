
<!DOCTYPE html>
<html>
<head>
    <title>EEE Catalogue</title>
    <link rel="stylesheet" href="style.css">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f6b982;
        }
        img {
            width: 70px;
            height: 85px;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body>

<h3 align="center">EEE Book Catalogue</h3>

<table>
    <tr>
        <th>Book Image</th>
        <th>Book Details</th>
        <th>Price</th>
        <th>Cart</th>
    </tr>

    <tr>
        <td><img src="eee1.jpg" alt="Electrical Machinery"></td>
        <td>
            Book: Electrical Machinery<br>
            Author: P. S. Bimbhra<br>
            Publisher: Khanna
        </td>
        <td>Rs. 400</td>
        <td><button>Add to Cart</button></td>
    </tr>

    <tr>
        <td><img src="eee2.jpg" alt="Power Systems"></td>
        <td>
            Book: Power System Engineering<br>
            Author: C. L. Wadhwa<br>
            Publisher: New Age
        </td>
        <td>Rs. 550</td>
        <td><button>Add to Cart</button></td>
    </tr>

    <tr>
        <td><img src="eee3.jpg" alt="Circuit Theory"></td>
        <td>
            Book: Circuit Theory<br>
            Author: A. Chakrabarti<br>
            Publisher: Dhanpat Rai
        </td>
        <td>Rs. 350</td>
        <td><button>Add to Cart</button></td>
    </tr>
</table>

</body>
</html>
